---
{{ if not .Values.os2mo.headless }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mo-naldo-deployment
  labels:
    app: mo-naldo
  {{- with .Values.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mo-naldo
  template:
    metadata:
      labels:
        app: mo-naldo
    spec:
      containers:
        - name: mo-naldo
          image: "{{ .Values.os2mo.naldo.image.registry }}/{{ .Values.os2mo.naldo.image.repository }}:{{ .Values.os2mo.naldo.image.tag }}"
          env:
            - name: PUBLIC_BASE_URL
              value: "https://{{ .Values.ingress.hostname }}"
            # Keycloak / OIDC configuration for the keycloak-js adapter.
            {{- $is_http := empty .Values.ingress.tls_secret }}
            {{- $protocol := ternary "http" "https" $is_http }}
            - name: PUBLIC_KEYCLOAK_URL
              value: "{{ $protocol }}://{{ .Values.ingress.hostname }}/auth/"
            - name: PUBLIC_KEYCLOAK_REALM
              value: "mo"
            - name: PUBLIC_KEYCLOAK_CLIENT_ID
              value: "mo-frontend"
            {{- range $name, $value := .Values.os2mo.naldo.environment }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - containerPort: 3000
          resources:
            {{- toYaml .Values.os2mo.naldo.resources | nindent 12 }}
      restartPolicy: Always
{{ end }}
