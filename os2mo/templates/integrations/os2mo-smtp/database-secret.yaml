---
{{- if .Values.os2mo_smtp.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: os2mo-smtp-database-secret
  {{- with .Values.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
    secret-generator.v1.mittwald.de/encoding: base32
    secret-generator.v1.mittwald.de/autogenerate: database_password
data: {}
{{- end }}
